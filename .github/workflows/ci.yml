name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history: the commit-message check inspects every commit in the push/PR range

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Check Linting
      run: npm run lint

    - name: Lint Specifications (EARS Syntax)
      run: npm run lint-specs

    - name: Verify Specification Traceability
      run: npm run verify-specs

    - name: Check Commit Messages Reference Requirement IDs
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
        elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
          RANGE="HEAD~1..HEAD"   # first push of a branch: only the tip is checkable
        else
          RANGE="${{ github.event.before }}..${{ github.sha }}"
        fi
        npm run check-commit-ids -- "$RANGE"

    - name: Run Tests and Coverage
      run: npm run coverage

    - name: Build Project
      run: npm run build
